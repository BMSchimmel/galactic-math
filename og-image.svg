<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03070f"/>
      <stop offset="100%" stop-color="#090630"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#c8860a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Nebula blobs -->
  <ellipse cx="160" cy="130" rx="300" ry="200" fill="rgba(26,39,100,0.45)"/>
  <ellipse cx="1040" cy="500" rx="280" ry="170" fill="rgba(65,10,95,0.4)"/>
  <ellipse cx="620" cy="540" rx="220" ry="120" fill="rgba(20,10,70,0.3)"/>

  <!-- Stars -->
  <circle cx="80"  cy="60"  r="1.5" fill="#e8f4ff" opacity="0.7"/>
  <circle cx="220" cy="30"  r="1"   fill="#e8f4ff" opacity="0.5"/>
  <circle cx="450" cy="80"  r="1.5" fill="#e8f4ff" opacity="0.6"/>
  <circle cx="700" cy="20"  r="1"   fill="#e8f4ff" opacity="0.8"/>
  <circle cx="950" cy="55"  r="1.5" fill="#e8f4ff" opacity="0.5"/>
  <circle cx="1100" cy="90" r="1"   fill="#e8f4ff" opacity="0.7"/>
  <circle cx="1180" cy="35" r="1.5" fill="#e8f4ff" opacity="0.4"/>
  <circle cx="60"  cy="400" r="1"   fill="#e8f4ff" opacity="0.6"/>
  <circle cx="340" cy="560" r="1.5" fill="#e8f4ff" opacity="0.5"/>
  <circle cx="580" cy="590" r="1"   fill="#e8f4ff" opacity="0.7"/>
  <circle cx="870" cy="610" r="1.5" fill="#e8f4ff" opacity="0.4"/>
  <circle cx="1150" cy="580" r="1"  fill="#e8f4ff" opacity="0.6"/>
  <circle cx="150" cy="300" r="1"   fill="#e8f4ff" opacity="0.4"/>
  <circle cx="1050" cy="200" r="1.5" fill="#e8f4ff" opacity="0.5"/>

  <!-- Planet logo mark — use assets/images/logo-planet-only.png at 240×175 centered -->
  <!-- NOTE: og-image.png is generated by the Python script in scripts/gen-og-image.py -->
  <!-- Placeholder circle representing the logo position -->
  <image href="assets/images/logo-planet-only.png" x="480" y="48" width="240" height="175"/>

  <!-- Title -->
  <text x="600" y="345" font-family="'Ubuntu', Arial Black, sans-serif" font-size="78" font-weight="900"
        fill="url(#titleGrad)" text-anchor="middle" letter-spacing="5">GALACTIC MATH</text>

  <!-- Tagline -->
  <text x="600" y="498" font-family="Arial, sans-serif" font-size="22"
        fill="#6b7fa3" text-anchor="middle" letter-spacing="2">Space-themed math training for kids</text>

  <!-- URL -->
  <text x="600" y="572" font-family="Arial, sans-serif" font-size="18"
        fill="#6b7fa3" text-anchor="middle" letter-spacing="2" opacity="0.7">galacticmath.app</text>
</svg>
